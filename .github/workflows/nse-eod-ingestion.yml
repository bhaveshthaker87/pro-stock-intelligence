name: NSE EOD history ingestion

on:
  schedule:
    # After the NSE cash-market close and typical EOD publication window (IST).
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nse-eod-history
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover, download, validate and persist official NSE EOD history
        run: |
          set -euo pipefail
          python3 tools/ingest_nse_eod_history.py --output-dir data/nse/eod

      - name: Commit validated daily history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nse/eod
          if git diff --cached --quiet; then
            echo "No new NSE EOD history to commit."
            exit 0
          fi
          git commit -m "data: persist validated NSE EOD history"
          git push origin HEAD:main
