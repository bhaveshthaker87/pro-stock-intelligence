name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s PRO_STOCK_INTELLIGENCE_V40_44_PROJECT_UPLOAD_FIXED.zip
          unzip -oq PRO_STOCK_INTELLIGENCE_V40_44_PROJECT_UPLOAD_FIXED.zip
          test -f PSI_ANDROID_STANDALONE_V40_44/app/src/main/AndroidManifest.xml
          test -f PSI_ANDROID_STANDALONE_V40_44/app/build.gradle
          test -f PSI_ANDROID_STANDALONE_V40_44/settings.gradle
          test -f PSI_ANDROID_STANDALONE_V40_44/build.gradle
          echo 'Project extracted. Gradle files found:'
          find PSI_ANDROID_STANDALONE_V40_44 -maxdepth 2 -name 'build.gradle' -print

      - name: Force consistent Java and Kotlin 17 targets
        shell: bash
        run: |
          set -euo pipefail
          cd PSI_ANDROID_STANDALONE_V40_44
          cat > gradle.properties <<'PROPERTIES'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          PROPERTIES
          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.prostock.intelligence'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.prostock.intelligence'
                  minSdk 26
                  targetSdk 35
                  versionCode 44
                  versionName '40.44'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          GRADLE
          echo '--- Actual app/build.gradle used for this build ---'
          cat app/build.gradle
          echo '--- Java version ---'
          java -version
          echo '--- Gradle version ---'
          gradle --version

      - name: Clean and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd PSI_ANDROID_STANDALONE_V40_44
          gradle --stop || true
          gradle clean assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo 'APK created successfully.'
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-APK
          path: PSI_ANDROID_STANDALONE_V40_44/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
