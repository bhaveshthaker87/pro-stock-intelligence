name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q PRO_STOCK_INTELLIGENCE_V40_44_PROJECT_UPLOAD_FIXED.zip
          test -f PSI_ANDROID_STANDALONE_V40_44/app/build.gradle
          echo "Android project extracted successfully"

      - name: Build APK
        run: |
          cd PSI_ANDROID_STANDALONE_V40_44
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > gradle.properties
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-APK
          path: PSI_ANDROID_STANDALONE_V40_44/app/build/outputs/apk/debug/app-debug.apk
