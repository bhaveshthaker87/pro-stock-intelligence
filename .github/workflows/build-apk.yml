name: Build PRO STOCK INTELLIGENCE APK

permissions:
  contents: read

concurrency:
  # One active build per branch regardless of push/PR/manual trigger; avoid duplicate competing APK builds.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      require_live_data:
        description: 'Require validated provider data before treating this run as release-ready'
        required: false
        type: boolean
        default: false
  # Feature branches are validated by pull_request; main also builds on direct pushes.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - v40-77-chart-refresh-readability
      - v40-78-nse-screener-only

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do not request the obsolete Android SDK "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install and verify Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          sdkmanager --list_installed
          adb version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate required files and manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/index.html
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("app/src/main/AndroidManifest.xml")
          print("Manifest XML is valid.")
          PY

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          source = pathlib.Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", source, flags=re.I | re.S)
          output = pathlib.Path("/tmp/psi-js")
          output.mkdir(parents=True, exist_ok=True)
          for i, script in enumerate(scripts):
              (output / f"script-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} script blocks.")
          PY
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find /tmp/psi-js -type f -name '*.js' -print0)
          node --check app/src/main/assets/csv-import.js
          node --check app/src/main/assets/xlsx-import.js

      - name: Install browser-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip playwright
          python3 -m playwright install --with-deps chromium

      - name: Run project unit and UI smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      # A build without an authorized gateway is useful for development, but must not
      # silently pass as a verified live-data release. Missing gateway is an explicit
      # non-fatal CI status; set REQUIRE_LIVE_PROVIDER_GATEWAY=true to enforce release gating.
      - name: Validate configured authorized provider gateway
        shell: bash
        env:
          PROVIDER_GATEWAY_BASE_URL: ${{ vars.PROVIDER_GATEWAY_BASE_URL }}
          REQUIRE_LIVE_PROVIDER_GATEWAY: ${{ vars.REQUIRE_LIVE_PROVIDER_GATEWAY }}
          REQUIRE_LIVE_DATA_INPUT: ${{ inputs.require_live_data }}
        run: |
          set -euo pipefail
          require_gateway="${REQUIRE_LIVE_PROVIDER_GATEWAY:-false}"
          if [ "${REQUIRE_LIVE_DATA_INPUT:-false}" = "true" ]; then require_gateway=true; fi
          if [ -z "${PROVIDER_GATEWAY_BASE_URL:-}" ]; then
            if [ "$require_gateway" = "true" ]; then
              echo "::error::Live provider validation is required but PROVIDER_GATEWAY_BASE_URL is not configured."
              exit 1
            fi
            echo "::warning::LIVE DATA NOT VERIFIED: PROVIDER_GATEWAY_BASE_URL is not configured. No live-feed pass is claimed. APK build may continue for development, but this run does not qualify as a live-data release."
            {
              echo "## Live market-data validation"
              echo "**Status: NOT VERIFIED**"
              echo "No authorized HTTPS provider gateway is configured. Quote, historical-candle, index, dividend and event end-to-end tests were not run."
              echo 'Configure repository variable `PROVIDER_GATEWAY_BASE_URL` to test the authorized gateway. Set `REQUIRE_LIVE_PROVIDER_GATEWAY=true` to make this a blocking release gate.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$PROVIDER_GATEWAY_BASE_URL" in https://*) ;; *) echo "::error::Gateway URL must use HTTPS."; exit 1;; esac
          mkdir -p /tmp/psi-provider
          curl --fail --silent --show-error --max-time 15 "$PROVIDER_GATEWAY_BASE_URL/v1/quote?symbol=INFY" -o /tmp/psi-provider/quote.json
          curl --fail --silent --show-error --max-time 20 "$PROVIDER_GATEWAY_BASE_URL/v1/history?symbol=INFY&range=1y" -o /tmp/psi-provider/history.json
          curl --fail --silent --show-error --max-time 15 "$PROVIDER_GATEWAY_BASE_URL/v1/events?eventType=ALL" -o /tmp/psi-provider/events.json
          curl --fail --silent --show-error --max-time 15 "$PROVIDER_GATEWAY_BASE_URL/v1/dividends" -o /tmp/psi-provider/dividends.json
          curl --fail --silent --show-error --max-time 15 "$PROVIDER_GATEWAY_BASE_URL/v1/indices" -o /tmp/psi-provider/indices.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/psi-provider")
          for name in ("quote", "history", "events", "dividends", "indices"):
              p = json.loads((root / f"{name}.json").read_text(encoding="utf-8"))
              if isinstance(p.get("data"), dict): p = p["data"]
              (root / f"{name}.json").write_text(json.dumps(p), encoding="utf-8")
          p = json.loads((root / "indices.json").read_text(encoding="utf-8"))
          if not isinstance(p.get("source"), str) or not p["source"].strip(): raise SystemExit("Index payload missing source")
          if not isinstance(p.get("asOf"), str) or not p["asOf"].strip(): raise SystemExit("Index payload missing asOf timestamp")
          if p.get("marketDataStatus") not in {"REALTIME", "DELAYED", "EOD"}: raise SystemExit("Index payload missing valid marketDataStatus")
          if not isinstance(p.get("rows"), list): raise SystemExit("Index payload rows must be an array")
          p = json.loads((root / "dividends.json").read_text(encoding="utf-8"))
          if not isinstance(p.get("source"), str) or not p["source"].strip(): raise SystemExit("Dividend payload missing source")
          if not isinstance(p.get("asOf"), str) or not p["asOf"].strip(): raise SystemExit("Dividend payload missing asOf timestamp")
          if p.get("marketDataStatus") not in {"REALTIME", "DELAYED", "EOD"}: raise SystemExit("Dividend payload missing valid marketDataStatus")
          if not isinstance(p.get("rows"), list): raise SystemExit("Dividend payload rows must be an array")
          print("Index/dividend payload contracts valid.")
          PY
          python3 tools/validate_provider_payloads.py quote /tmp/psi-provider/quote.json --expected-symbol INFY
          python3 tools/validate_provider_payloads.py history /tmp/psi-provider/history.json --expected-symbol INFY
          python3 tools/validate_provider_payloads.py events /tmp/psi-provider/events.json
          python3 tools/validate_provider_payloads.py indices /tmp/psi-provider/indices.json
          python3 tools/validate_provider_payloads.py dividends /tmp/psi-provider/dividends.json
          {
            echo "## Live market-data validation"
            echo "**Status: PASSED**"
            echo "Authorized provider gateway responded successfully for quote, history, events, dividends and indices; normalized payload validators passed."
          } >> "$GITHUB_STEP_SUMMARY"

      # Publish the APK immediately after a successful build; emulator validation is intentionally separate so an unstable virtual device cannot block delivery.
      - name: Build debug APK
        shell: bash
        env:
          PROVIDER_GATEWAY_BASE_URL: ${{ vars.PROVIDER_GATEWAY_BASE_URL }}
        run: |
          set -euo pipefail
          # Maven Central can temporarily throttle hosted runners (HTTP 429).
          # Retry dependency resolution/build with bounded backoff; never mask a persistent compile failure.
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "APK build attempt $attempt/$max_attempts"
            if gradle :app:assembleDebug --no-daemon --stacktrace -PproviderGatewayBaseUrl="${PROVIDER_GATEWAY_BASE_URL:-}"; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::APK build failed after $max_attempts attempts. Review the Gradle error above."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::Gradle build failed; retrying after ${delay}s to recover from transient repository throttling or network errors."
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Generate APK SHA-256 checksum
        if: always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          cat app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK and checksum
        if: always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-V40-84-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:lintDebug --no-daemon --stacktrace

      - name: Upload Android lint report
        if: always() && hashFiles('app/build/reports/lint-results-debug.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-V40-84-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Release Gradle daemons before emulator
        if: always()
        shell: bash
        run: |
          gradle --stop || true
          # Avoid carrying compiler daemons into the memory-constrained AVD phase.
          jps -lv | awk '/GradleDaemon/ {print $1}' | xargs -r kill || true

      - name: Enable KVM hardware acceleration for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu runners expose /dev/kvm, but it may be group-only.
          # The emulator action otherwise silently falls back to software TCG,
          # which made this x86_64 AVD remain offline for the entire boot timeout.
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not available on this runner; cannot safely run the x86_64 emulator smoke test."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::KVM device is not readable/writable; refusing a slow software-emulation run."
            ls -l /dev/kvm || true
            exit 1
          fi
          ls -l /dev/kvm
          echo "KVM hardware acceleration is available."

      - name: Verify ADB before emulator launch
        shell: bash
        run: |
          set -euo pipefail
          # Do not kill/restart ADB here: android-emulator-runner owns the ADB
          # lifecycle. A second server restart can detach the action from its AVD.
          adb version
          adb start-server
          adb devices -l

      - name: Run Android emulator smoke test and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          disable-spellchecker: true
          # Restore adequate resources: 2 GB / 2 cores caused a 15-minute boot
          # on the hosted runner and left too little time for app validation.
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-load -no-snapshot-save -gpu swiftshader_indirect -memory 4096 -cores 4 -camera-back none
          script: bash .github/scripts/android-smoke-test.sh

      - name: Upload emulator dashboard screenshot and diagnostics
        if: always() && hashFiles('app/build/outputs/psi-emulator-logcat.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-V40-84-emulator-diagnostics
          path: |
            app/build/outputs/psi-emulator.png
            app/build/outputs/psi-emulator-logcat.txt
            app/build/outputs/psi-emulator-crash-buffer.txt
            app/build/outputs/psi-app-meminfo.txt
            app/build/outputs/psi-webview-provider.txt
            app/build/outputs/psi-activity-dump.txt
          if-no-files-found: warn
