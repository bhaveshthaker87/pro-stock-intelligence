name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s PRO_STOCK_INTELLIGENCE_V40_44_PROJECT_UPLOAD_FIXED.zip
          unzip -oq PRO_STOCK_INTELLIGENCE_V40_44_PROJECT_UPLOAD_FIXED.zip
          PROJECT="PSI_ANDROID_STANDALONE_V40_44"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/java/com/prostock/intelligence/MainActivity.kt"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/build.gradle"
          echo 'Android project extracted and required files verified.'

      - name: Normalize Kotlin Yahoo Finance JSON parsing and enforce Java 17
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="PSI_ANDROID_STANDALONE_V40_44"
          cd "$PROJECT"
          SOURCE="app/src/main/java/com/prostock/intelligence/MainActivity.kt"
          test -s "$SOURCE"

          # Replace the entire compact Yahoo parsing declaration, not a fragile
          # method-name substring. This handles older malformed ZIP variants too.
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/prostock/intelligence/MainActivity.kt")
          lines = p.read_text(encoding="utf-8").splitlines()
          matches = [i for i, line in enumerate(lines) if re.search(r"\bval\s+meta\s*=", line) and re.search(r"\bval\s+q\s*=", line) and re.search(r"\bval\s+ts\s*=", line)]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one Yahoo JSON declaration line, found {len(matches)}")
          i = matches[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i:i+1] = [
              indent + 'val meta = r.getJSONObject("meta")',
              indent + 'val q = r.getJSONObject("indicators").getJSONArray("quote").getJSONObject(0)',
              indent + 'val ts = r.getJSONArray("timestamp")',
          ]
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Normalized Yahoo JSON parsing at original line {i+1}.")
          PYCODE

          cat > gradle.properties <<'PROPERTIES'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.prostock.intelligence'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.prostock.intelligence'
                  minSdk 26
                  targetSdk 35
                  versionCode 44
                  versionName '40.44'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          GRADLE

          echo '--- Actual normalized MainActivity.kt lines 78-91 ---'
          nl -ba "$SOURCE" | sed -n '78,91p'
          echo '--- Confirm corrected JSON declaration ---'
          grep -F 'val q = r.getJSONObject("indicators").getJSONArray("quote").getJSONObject(0)' "$SOURCE"
          echo '--- app/build.gradle used for build ---'
          cat app/build.gradle
          echo '--- Java version ---'
          java -version
          echo '--- Gradle version ---'
          gradle --version

      - name: Clean and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd PSI_ANDROID_STANDALONE_V40_44
          gradle --stop || true
          gradle clean assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo 'APK created successfully.'
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-APK
          path: PSI_ANDROID_STANDALONE_V40_44/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
