
name: Build PRO STOCK INTELLIGENCE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found."
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"
          echo "Android SDK root: $SDK_ROOT"

          set +e
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          LICENSE_STATUS=$?
          set -e

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "Checking whether SDK licenses were accepted..."
          fi

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"
          test -d "$SDK_ROOT/platform-tools"

          echo "Android SDK packages verified."

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="PRO_STOCK_INTELLIGENCE_V40_44_PROJECT_UPLOAD.zip"
          PROJECT_DIR="PSI_ANDROID_STANDALONE_V40_44"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found: $ZIP_FILE"
            echo "Files available in repository:"
            ls -la
            exit 1
          fi

          unzip -q "$ZIP_FILE"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app build.gradle not found."
            echo "Searching extracted project files:"
            find . -maxdepth 5 -name build.gradle -print
            exit 1
          fi

          echo "Android project extracted successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd PSI_ANDROID_STANDALONE_V40_44

          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties

          gradle --version
          gradle assembleDebug --no-daemon --stacktrace

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK built successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-APK
          path: PSI_ANDROID_STANDALONE_V40_44/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
