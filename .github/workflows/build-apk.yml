
name: Build PRO STOCK INTELLIGENCE APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, expert-remediation-v40-67]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install and verify Android SDK packages
        run: |
          sdkmanager --install platform-tools 'platforms;android-35' 'build-tools;35.0.0'
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate project and inline JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYCODE'
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.')
          manifest = root / 'app/src/main/AndroidManifest.xml'
          html_file = root / 'app/src/main/assets/index.html'

          if not manifest.is_file():
              raise SystemExit(f'Missing Android manifest: {manifest}')
          if not html_file.is_file():
              raise SystemExit(f'Missing dashboard HTML: {html_file}')

          ET.parse(manifest)

          html = html_file.read_text(encoding='utf-8')
          scripts = re.findall(
              r'<script\b[^>]*>(.*?)</script>',
              html,
              flags=re.I | re.S
          )

          if not scripts:
              raise SystemExit('No inline scripts found')

          for i, script in enumerate(scripts):
              pathlib.Path(f'/tmp/psi-inline-{i}.js').write_text(
                  script, encoding='utf-8'
              )

          print(
              f'Manifest XML valid; extracted {len(scripts)} inline script blocks'
          )
          PYCODE

          for f in /tmp/psi-inline-*.js; do
            node --check "$f"
          done

      - name: Install browser-test dependencies
        run: |
          python3 -m pip install --upgrade pip playwright
          python3 -m playwright install --with-deps chromium

      - name: Test backtesting and complete dashboard UI smoke suite
        run: python3 -m unittest discover -s tests -v

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Emulator smoke test (launch app)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail

            adb wait-for-device

            for i in $(seq 1 60); do
              BOOTED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              if [ "$BOOTED" = "1" ]; then
                break
              fi
              sleep 5
            done

            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.prostock.intelligence/.MainActivity
            sleep 8

            adb shell pidof com.prostock.intelligence

            adb shell dumpsys activity activities \
              | grep -E 'mResumedActivity|ResumedActivity' \
              | grep 'com.prostock.intelligence'

            mkdir -p app/build/outputs
            adb exec-out screencap -p > app/build/outputs/psi-emulator.png
            test -s app/build/outputs/psi-emulator.png

            python3 - <<'PYCODE'
            from pathlib import Path

            image = Path(
                'app/build/outputs/psi-emulator.png'
            ).read_bytes()

            if not image.startswith(bytes.fromhex('89504e470d0a1a0a')):
                raise SystemExit('Emulator screenshot is not a valid PNG')

            print(f'PNG screenshot verified: {len(image)} bytes')
            PYCODE

            adb logcat -d -s AndroidRuntime:E PSI_WEB:E \
              > /tmp/psi-runtime-errors.txt

            cat /tmp/psi-runtime-errors.txt

            if grep -Eq \
              'FATAL EXCEPTION|Uncaught (ReferenceError|TypeError|SyntaxError)' \
              /tmp/psi-runtime-errors.txt; then
              exit 1
            fi

      - name: Upload Android lint report
        if: always() && hashFiles('app/build/reports/lint-results-debug.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-V40-65-lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Upload emulator screenshot
        if: always() && hashFiles('app/build/outputs/psi-emulator.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-V40-65-emulator-screenshot
          path: app/build/outputs/psi-emulator.png

      - name: Generate APK checksum
        if: always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk \
            > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK and checksum
        if: always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-V40-65-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
