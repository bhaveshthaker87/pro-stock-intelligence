name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q PRO_STOCK_INTELLIGENCE_V40_44_PROJECT_UPLOAD.zip
          find . -maxdepth 3 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project
        run: |
          find . -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find . -name settings.gradle | head -1)")
          cd "$PROJECT"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
