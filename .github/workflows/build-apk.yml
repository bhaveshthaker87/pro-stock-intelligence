name: Build PRO STOCK INTELLIGENCE APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - expert-remediation-v40-67
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            platform-tools \
            'platforms;android-35' \
            'build-tools;35.0.0'
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          adb version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/index.html
          test -d app/src/main
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("app/src/main/AndroidManifest.xml")
          print("Android manifest XML is valid.")
          PY

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          html_path = pathlib.Path("app/src/main/assets/index.html")
          html = html_path.read_text(encoding="utf-8")
          scripts = re.findall(
              r"<script\b[^>]*>(.*?)</script>",
              html,
              flags=re.I | re.S
          )

          if not scripts:
              print("No inline JavaScript blocks found.")
              sys.exit(1)

          out = pathlib.Path("/tmp/psi-js")
          out.mkdir(parents=True, exist_ok=True)

          for index, script in enumerate(scripts):
              (out / f"script-{index}.js").write_text(
                  script, encoding="utf-8"
              )

          print(f"Extracted {len(scripts)} JavaScript blocks.")
          PY

          for file in /tmp/psi-js/*.js; do
            node --check "$file"
          done

      - name: Install browser-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip playwright
          python3 -m playwright install --with-deps chromium

      - name: Run project tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:lintDebug --stacktrace

      - name: Verify APK and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload Android lint report
        if: always() && hashFiles('app/build/reports/lint-results-debug.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-V40-65-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Upload APK and checksum
        if: success() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-V40-65-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
```
