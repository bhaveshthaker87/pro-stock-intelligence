name: Build PRO STOCK INTELLIGENCE APK

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - expert-remediation-v40-67
      - expert-pro-hardening-v40-66
      - v40-78-nse-screener-only
      - fix/v40-79-diamond-data-chart
      - fix/v40-80-provider-gateway-validation
  pull_request:
    branches:
      - main
      - v40-77-chart-refresh-readability
      - v40-78-nse-screener-only

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do not request the obsolete Android SDK "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install and verify Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          sdkmanager --list_installed
          adb version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate required files and manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/index.html
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("app/src/main/AndroidManifest.xml")
          print("Manifest XML is valid.")
          PY

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          source = pathlib.Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", source, flags=re.I | re.S)
          output = pathlib.Path("/tmp/psi-js")
          output.mkdir(parents=True, exist_ok=True)
          for i, script in enumerate(scripts):
              (output / f"script-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} script blocks.")
          PY
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find /tmp/psi-js -type f -name '*.js' -print0)
          node --check app/src/main/assets/csv-import.js

      - name: Install browser-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip playwright
          python3 -m playwright install --with-deps chromium

      - name: Compile Python tests before execution
        run: python -m compileall -q tests tools

      - name: Run project unit and UI smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      # Publish the APK immediately after a successful build; emulator validation is intentionally separate so an unstable virtual device cannot block delivery.
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Generate APK SHA-256 checksum
        if: always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          cat app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK and checksum
        if: always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-V40-80-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:lintDebug --no-daemon --stacktrace

      - name: Run Android emulator smoke test and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            # android-emulator-runner runs this through /bin/sh (dash), which
            # does not support Bash's pipefail option.
            set -eu
            adb wait-for-device
            # Emulator boot can take longer than adb wait-for-device; poll boot completion instead of failing on the first empty property read.
            boot_ready=0
            for attempt in $(seq 1 90); do
              boot_state="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)"
              if [ "$boot_state" = "1" ]; then boot_ready=1; break; fi
              sleep 2
            done
            if [ "$boot_ready" != "1" ]; then
              echo "Emulator did not finish booting within 180 seconds."
              adb devices -l || true
              adb shell getprop sys.boot_completed || true
              exit 1
            fi
            # Test the actual app, not just the emulator home screen.
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.prostock.intelligence
            adb shell am start -n com.prostock.intelligence/.MainActivity
            # Wait for a real rendered dashboard; avoid nested heredocs because this script is executed by the emulator action's shell wrapper.
            mkdir -p app/build/outputs
            python3 -m pip install --quiet pillow numpy
            dashboard_ready=0
            for attempt in $(seq 1 30); do
              adb shell dumpsys activity activities | grep -q 'com.prostock.intelligence/.MainActivity' || { sleep 2; continue; }
              adb exec-out screencap -p > app/build/outputs/psi-emulator.png
              if python3 -c 'from PIL import Image; import numpy as np; a=np.asarray(Image.open("app/build/outputs/psi-emulator.png").convert("RGB")); nonwhite=float((a < 245).any(axis=2).mean()); colors=int(np.unique(a.reshape(-1,3),axis=0).shape[0]); print("Visual readiness: nonwhite={:.3f}, colors={}".format(nonwhite,colors)); raise SystemExit(0 if nonwhite > 0.05 and colors > 2500 else 1)'; then
                dashboard_ready=1
                break
              fi
              sleep 2
            done
            test "$dashboard_ready" = 1 || { adb logcat -d -s PSI_WEB:E AndroidRuntime:E chromium:E; echo "Dashboard did not render; screenshot remained splash/blank or visually incomplete."; exit 1; }
            test -s app/build/outputs/psi-emulator.png
            python3 -c 'from pathlib import Path; p=Path("app/build/outputs/psi-emulator.png"); data=p.read_bytes(); assert data.startswith(bytes.fromhex("89504e470d0a1a0a")), "Emulator screenshot is not a valid PNG"; print("Valid emulator screenshot — rendered dashboard: {} ({} bytes)".format(p, len(data)))'

      - name: Upload emulator screenshot
        if: always() && hashFiles('app/build/outputs/psi-emulator.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-V40-80-emulator-screenshot
          path: app/build/outputs/psi-emulator.png
          if-no-files-found: error


      - name: Upload Android lint report
        if: always() && hashFiles('app/build/reports/lint-results-debug.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PRO-STOCK-INTELLIGENCE-V40-80-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
