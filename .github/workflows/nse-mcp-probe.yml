name: NSE CM Market MCP personal-use probe

on:
  push:
    branches:
      - feat/nse-mcp-live-personal-use
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official MCP client SDK
        run: npm install --no-save @modelcontextprotocol/sdk
      - name: Probe official NSE MCP (no credentials)
        run: |
          set -euo pipefail
          node tools/probe_nse_cm_mcp.mjs | tee nse-mcp-probe.json
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-cm-mcp-probe
          path: nse-mcp-probe.json
          if-no-files-found: ignore
