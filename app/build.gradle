plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

android { namespace 'com.prostock.intelligence'; compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'com.prostock.intelligence'; minSdk 26; targetSdk 35; versionCode 83; versionName '40.84'
        buildConfigField 'String', 'PROVIDER_GATEWAY_BASE_URL', '"' + (providers.gradleProperty('providerGatewayBaseUrl').getOrElse('')) + '"' }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
