plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

android { namespace 'com.prostock.intelligence'; compileSdk 35
    defaultConfig { applicationId 'com.prostock.intelligence'; minSdk 26; targetSdk 35; versionCode 75; versionName '40.76' }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
